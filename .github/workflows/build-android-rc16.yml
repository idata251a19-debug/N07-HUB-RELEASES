name: Build Android 16.0.5 iData Scanner Fix

on:
  push:
    branches:
      - tmp/android-rc16-final-20260823
    paths:
      - build/trigger-final.txt

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Android 16.0.5+48
        id: compile
        shell: bash
        continue-on-error: true
        run: |
          set +e
          rm -rf build-output /tmp/rc16-src app
          mkdir -p build-output /tmp/rc16-src
          (
            set -euxo pipefail
            flutter --version

            # Reconstruct the exact RC16 source used by the approved build.
            cat build/android_rc16_exact_v2/part{00..10}.txt \
                build/android_rc16_exact_v3/part11_00.txt \
                build/android_rc16_exact_v3/part11_01.txt \
                build/android_rc16_exact_v3/part11_02.txt \
                build/android_rc16_exact_v3/part12_00.txt \
                build/android_rc16_exact_v3/part12_01.txt > /tmp/android_rc16_source.b64
            base64 -d /tmp/android_rc16_source.b64 > /tmp/android_rc16_source.zip
            echo '8f07eb28c3e7ef5314e2c7a647d02343b1b15c6da60b6d1976892f70ffbd90b1  /tmp/android_rc16_source.zip' | sha256sum -c -
            unzip -t /tmp/android_rc16_source.zip
            unzip -q /tmp/android_rc16_source.zip -d /tmp/rc16-src

            # Apply cumulative source changes through 16.0.5+48.
            cat build/apk_16_0_5/core_patch_part00.txt \
                build/apk_16_0_5/core_patch_part01.txt > /tmp/apk_16_0_5_core.patch
            echo '2517c7825b3d65240b1e7359a6c8fc63fb4bfe3225128028a205d6e410a669d1  /tmp/apk_16_0_5_core.patch' | sha256sum -c -
            cd /tmp/rc16-src/N07_HUBDNI_ANDROID_RC16_SOURCE
            patch -p1 < /tmp/apk_16_0_5_core.patch

            # Guard the exact scanner/resume fix before compiling.
            python3 - <<'PY'
          from pathlib import Path
          root = Path('/tmp/rc16-src/N07_HUBDNI_ANDROID_RC16_SOURCE')
          main = (root / 'lib/main.dart').read_text(encoding='utf-8')
          pub = (root / 'pubspec.yaml').read_text(encoding='utf-8')
          assert 'version: 16.0.5+48' in pub
          assert 'onKeyEvent: _onHardwareKeyEvent' in main
          assert 'FocusNode _manualTextFocus' in main
          assert 'for (final delayMs in <int>[80, 180, 360, 700])' in main
          assert 'LogicalKeyboardKey.enter' in main
          assert 'LogicalKeyboardKey.numpadEnter' in main
          assert 'LogicalKeyboardKey.tab' in main
          assert 'if (!_hardwareSessionStarted)' in main
          assert 'widget.controller.clear();' in main
          assert 'keyboardType: TextInputType.text' in main
          assert 'alignment: 0.08' in main
          assert '_scrollToSlot(outcome.slot!)' in main
          assert '_manualKeyboard ? TextInputType.text : TextInputType.none' not in main
          print('PASS 16.0.5 iData scanner resume guards')
          PY

            python3 test/qa_backend_hashes_v25.py
            python3 test/qa_slot_layout_v25.py
            (cd google_sheet_backend && node ../test/qa_backend_v25.js Code_VF_E2W_V25.gs)
            (cd google_sheet_backend && node ../test/qa_backend_v25.js Code_AUTO_EV_V25.gs)

            cd "$GITHUB_WORKSPACE"
            flutter create app --platforms=android --org vn.hubdni --project-name n07_hub_v1
            cp -a /tmp/rc16-src/N07_HUBDNI_ANDROID_RC16_SOURCE/. app/
            cp app/AndroidManifest.xml app/android/app/src/main/AndroidManifest.xml
            rm -f app/test/widget_test.dart.bak

            # Keep the approved vertical background already used by RC16.
            mkdir -p app/assets/background
            cat build/bg_ui1_parts/part00.txt \
                build/bg_ui1_parts/part01.txt \
                build/bg_ui1_parts/part02.txt \
                build/bg_ui1_parts/part03.txt \
                build/bg_ui1_parts/part04.txt > /tmp/n07_bg.b64
            base64 -d /tmp/n07_bg.b64 > app/assets/background/n07_background_vertical.jpg
            echo '5e850e3747117269be71f2a369549d56d2b2c6e7e4bbb98d720a1ae210f14b5c  app/assets/background/n07_background_vertical.jpg' | sha256sum -c -

            python3 - <<'PY'
          from pathlib import Path
          p = Path('app/android/app/build.gradle.kts')
          p.write_text(p.read_text().replace('minSdk = flutter.minSdkVersion', 'minSdk = 23'))
          PY

            cd app
            flutter pub get
            dart format lib test
            flutter analyze --no-fatal-infos --no-fatal-warnings
            flutter test
            flutter build apk --release
            cp build/app/outputs/flutter-apk/app-release.apk ../build-output/N07_HUBDNI_ANDROID_16_0_5_IDATA_SCANNER_FIX.apk
            cd ..
            sha256sum build-output/N07_HUBDNI_ANDROID_16_0_5_IDATA_SCANNER_FIX.apk | tee build-output/N07_HUBDNI_ANDROID_16_0_5_IDATA_SCANNER_FIX.sha256
            unzip -l build-output/N07_HUBDNI_ANDROID_16_0_5_IDATA_SCANNER_FIX.apk | grep 'assets/flutter_assets/assets/background/n07_background_vertical.jpg'
          ) > build-output/build.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -300 build-output/build.log || true
          exit 0

      - name: Commit build result
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-output
          git commit -m 'build: Android 16.0.5 iData scanner fix result [skip ci]' || true
          git push origin HEAD:tmp/android-rc16-final-20260823

      - name: Upload APK artifact
        if: steps.compile.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: N07_HUBDNI_ANDROID_16_0_5_IDATA_SCANNER_FIX
          path: |
            build-output/N07_HUBDNI_ANDROID_16_0_5_IDATA_SCANNER_FIX.apk
            build-output/N07_HUBDNI_ANDROID_16_0_5_IDATA_SCANNER_FIX.sha256
            build-output/build.log
          if-no-files-found: error
          retention-days: 3

      - name: Fail build if compile failed
        if: steps.compile.outputs.status != '0'
        run: exit 1
