name: Build Android RC16

on:
  push:
    branches:
      - tmp/android-rc16-final-20260823
    paths:
      - build/trigger-final.txt

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build and capture diagnostics
        id: compile
        shell: bash
        continue-on-error: true
        run: |
          set +e
          rm -rf build-output /tmp/rc16-src app
          mkdir -p build-output /tmp/rc16-src
          (
            set -euxo pipefail
            flutter --version
            cat build/android_rc16_exact_v2/part{00..10}.txt \
                build/android_rc16_exact_v3/part11_00.txt \
                build/android_rc16_exact_v3/part11_01.txt \
                build/android_rc16_exact_v3/part11_02.txt \
                build/android_rc16_exact_v3/part12_00.txt \
                build/android_rc16_exact_v3/part12_01.txt > /tmp/android_rc16_source.b64
            base64 -d /tmp/android_rc16_source.b64 > /tmp/android_rc16_source.zip
            echo '8f07eb28c3e7ef5314e2c7a647d02343b1b15c6da60b6d1976892f70ffbd90b1  /tmp/android_rc16_source.zip' | sha256sum -c -
            unzip -t /tmp/android_rc16_source.zip
            unzip -q /tmp/android_rc16_source.zip -d /tmp/rc16-src
            python3 /tmp/rc16-src/N07_HUBDNI_ANDROID_RC16_SOURCE/test/qa_backend_hashes_v25.py
            python3 /tmp/rc16-src/N07_HUBDNI_ANDROID_RC16_SOURCE/test/qa_slot_layout_v25.py
            node /tmp/rc16-src/N07_HUBDNI_ANDROID_RC16_SOURCE/test/qa_backend_v25.js /tmp/rc16-src/N07_HUBDNI_ANDROID_RC16_SOURCE/google_sheet_backend/Code_VF_E2W_V25.gs
            node /tmp/rc16-src/N07_HUBDNI_ANDROID_RC16_SOURCE/test/qa_backend_v25.js /tmp/rc16-src/N07_HUBDNI_ANDROID_RC16_SOURCE/google_sheet_backend/Code_AUTO_EV_V25.gs
            flutter create app --platforms=android --org vn.hubdni --project-name n07_hub_v1
            cp -a /tmp/rc16-src/N07_HUBDNI_ANDROID_RC16_SOURCE/. app/
            cp app/AndroidManifest.xml app/android/app/src/main/AndroidManifest.xml
            rm -f app/test/widget_test.dart.bak
            python3 - <<'PY'
          from pathlib import Path
          p=Path('app/android/app/build.gradle.kts')
          s=p.read_text().replace('minSdk = flutter.minSdkVersion','minSdk = 23')
          p.write_text(s)
          PY
            cd app
            flutter pub get
            dart format lib test
            flutter analyze
            flutter test
            flutter build apk --release
            cp build/app/outputs/flutter-apk/app-release.apk ../build-output/N07_HUBDNI_ANDROID_RC16.apk
            cd ..
            sha256sum build-output/N07_HUBDNI_ANDROID_RC16.apk | tee build-output/N07_HUBDNI_ANDROID_RC16.sha256
          ) > build-output/build.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -250 build-output/build.log || true
          exit 0
      - name: Commit build result
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-output
          git commit -m 'build: N07 Android RC16 final result [skip ci]' || true
          git push origin HEAD:tmp/android-rc16-final-20260823
      - name: Upload APK artifact
        if: steps.compile.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: N07_HUBDNI_ANDROID_RC16
          path: |
            build-output/N07_HUBDNI_ANDROID_RC16.apk
            build-output/N07_HUBDNI_ANDROID_RC16.sha256
            build-output/build.log
          if-no-files-found: error
          retention-days: 3
      - name: Fail build if compile failed
        if: steps.compile.outputs.status != '0'
        run: exit 1
