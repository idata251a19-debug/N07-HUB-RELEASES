name: Build Android RC16 Background

on:
  push:
    branches:
      - tmp/android-rc16-final-20260823
    paths:
      - build/trigger-final.txt
  pull_request:
    branches:
      - main
    paths:
      - build/**
      - .github/workflows/build-android-rc16.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build RC16 with vertical background
        id: compile
        shell: bash
        continue-on-error: true
        run: |
          set +e
          rm -rf build-output /tmp/rc16-src app
          mkdir -p build-output /tmp/rc16-src
          (
            set -euxo pipefail
            flutter --version
            cat build/android_rc16_exact_v2/part{00..10}.txt \
                build/android_rc16_exact_v3/part11_00.txt \
                build/android_rc16_exact_v3/part11_01.txt \
                build/android_rc16_exact_v3/part11_02.txt \
                build/android_rc16_exact_v3/part12_00.txt \
                build/android_rc16_exact_v3/part12_01.txt > /tmp/android_rc16_source.b64
            base64 -d /tmp/android_rc16_source.b64 > /tmp/android_rc16_source.zip
            echo '8f07eb28c3e7ef5314e2c7a647d02343b1b15c6da60b6d1976892f70ffbd90b1  /tmp/android_rc16_source.zip' | sha256sum -c -
            unzip -t /tmp/android_rc16_source.zip
            unzip -q /tmp/android_rc16_source.zip -d /tmp/rc16-src
            python3 /tmp/rc16-src/N07_HUBDNI_ANDROID_RC16_SOURCE/test/qa_backend_hashes_v25.py
            python3 /tmp/rc16-src/N07_HUBDNI_ANDROID_RC16_SOURCE/test/qa_slot_layout_v25.py
            (cd /tmp/rc16-src/N07_HUBDNI_ANDROID_RC16_SOURCE/google_sheet_backend && node ../test/qa_backend_v25.js Code_VF_E2W_V25.gs)
            (cd /tmp/rc16-src/N07_HUBDNI_ANDROID_RC16_SOURCE/google_sheet_backend && node ../test/qa_backend_v25.js Code_AUTO_EV_V25.gs)

            flutter create app --platforms=android --org vn.hubdni --project-name n07_hub_v1
            cp -a /tmp/rc16-src/N07_HUBDNI_ANDROID_RC16_SOURCE/. app/
            cp app/AndroidManifest.xml app/android/app/src/main/AndroidManifest.xml
            rm -f app/test/widget_test.dart.bak

            mkdir -p app/assets/background
            base64 -d build/background_rc16/N07_HUBDNI_BACKGROUND_VERTICAL_RC16.jpg.b64 > app/assets/background/n07_background_vertical.jpg
            echo '5e850e3747117269be71f2a369549d56d2b2c6e7e4bbb98d720a1ae210f14b5c  app/assets/background/n07_background_vertical.jpg' | sha256sum -c -

            python3 - <<'PY'
          from pathlib import Path

          p = Path('app/android/app/build.gradle.kts')
          s = p.read_text().replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
          p.write_text(s)

          d = Path('app/lib/main.dart')
          s = d.read_text()
          old = "    String action, [\n    Map<String, dynamic> extra = const {},\n  ], {\n"
          new = "    String action,\n    Map<String, dynamic> extra, {\n"
          if old in s:
              s = s.replace(old, new, 1)
          s = s.replace("Future<Map<String, dynamic>> pingInfo() async => _call('ping');", "Future<Map<String, dynamic>> pingInfo() async => _call('ping', const {});")
          s = s.replace("final data = await _call('revision');", "final data = await _call('revision', const {});")
          s = s.replace("final data = await _call('syncSnapshot');", "final data = await _call('syncSnapshot', const {});")

          shell = r'''
          class _N07BackgroundShell extends StatelessWidget {
            const _N07BackgroundShell({required this.child});
            final Widget child;

            @override
            Widget build(BuildContext context) {
              final baseTheme = Theme.of(context);
              return Theme(
                data: baseTheme.copyWith(
                  scaffoldBackgroundColor: Colors.transparent,
                  canvasColor: Colors.transparent,
                ),
                child: Stack(
                  fit: StackFit.expand,
                  children: [
                    Image.asset(
                      'assets/background/n07_background_vertical.jpg',
                      fit: BoxFit.cover,
                      alignment: Alignment.center,
                    ),
                    const ColoredBox(color: Color(0x12000000)),
                    child,
                  ],
                ),
              );
            }
          }

          '''
          if 'class _N07BackgroundShell extends StatelessWidget' not in s:
              idx = s.find('void main(')
              if idx < 0:
                  raise SystemExit('void main() not found for background shell insertion')
              s = s[:idx] + shell + s[idx:]

          if '_N07BackgroundShell(child:' not in s:
              if 'MaterialApp(' in s:
                  s = s.replace(
                      'MaterialApp(',
                      "MaterialApp(\n      builder: (context, child) => _N07BackgroundShell(child: child ?? const SizedBox.shrink()),",
                      1,
                  )
              elif 'MaterialApp.router(' in s:
                  s = s.replace(
                      'MaterialApp.router(',
                      "MaterialApp.router(\n      builder: (context, child) => _N07BackgroundShell(child: child ?? const SizedBox.shrink()),",
                      1,
                  )
              else:
                  raise SystemExit('MaterialApp not found for background builder insertion')
          d.write_text(s)

          pub = Path('app/pubspec.yaml')
          y = pub.read_text()
          asset = '    - assets/background/n07_background_vertical.jpg'
          if asset not in y:
              if '  assets:\n' in y:
                  y = y.replace('  assets:\n', '  assets:\n' + asset + '\n', 1)
              elif '  uses-material-design: true' in y:
                  y = y.replace(
                      '  uses-material-design: true',
                      '  uses-material-design: true\n  assets:\n' + asset,
                      1,
                  )
              else:
                  raise SystemExit('flutter asset insertion point not found in pubspec.yaml')
          pub.write_text(y)
          PY

            cd app
            flutter pub get
            dart format lib test
            flutter analyze --no-fatal-infos --no-fatal-warnings
            flutter test
            flutter build apk --release
            cp build/app/outputs/flutter-apk/app-release.apk ../build-output/N07_HUBDNI_ANDROID_RC16_BG.apk
            cd ..
            sha256sum build-output/N07_HUBDNI_ANDROID_RC16_BG.apk | tee build-output/N07_HUBDNI_ANDROID_RC16_BG.sha256
            unzip -l build-output/N07_HUBDNI_ANDROID_RC16_BG.apk | grep 'assets/flutter_assets/assets/background/n07_background_vertical.jpg'
          ) > build-output/build.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -250 build-output/build.log || true
          exit 0

      - name: Commit build result
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-output
          git commit -m 'build: N07 Android RC16 background result [skip ci]' || true
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Upload APK artifact
        if: steps.compile.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: N07_HUBDNI_ANDROID_RC16_BG
          path: |
            build-output/N07_HUBDNI_ANDROID_RC16_BG.apk
            build-output/N07_HUBDNI_ANDROID_RC16_BG.sha256
            build-output/build.log
          if-no-files-found: error
          retention-days: 3

      - name: Fail build if compile failed
        if: steps.compile.outputs.status != '0'
        run: exit 1
